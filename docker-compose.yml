version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: crm_postgres
    restart: always
    environment:
      POSTGRES_DB: crm_atacama
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      # Senha do user read-only (criado pelo init.sql)
      CRM_READONLY_PASSWORD: ${CRM_READONLY_PASSWORD:?Defina CRM_READONLY_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts de inicialização (executados na PRIMEIRA vez que o container sobe)
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/postgres/init-hardening.sh:/docker-entrypoint-initdb.d/02-hardening.sh:ro
      # Configuração customizada de segurança
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm_user} -d crm_atacama"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Sem port mapping externo — banco acessível APENAS dentro do Docker

  crm:
    build: .
    container_name: crm_app
    restart: always
    # WP-OPS-01: sem port mapping no host — acesso SOMENTE via Traefik (rede Docker).
    # Remove o bypass do TLS que existia ao publicar 8000 direto no host.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      # App usa crm_user (owner) — pode criar tabelas + DML
      - DATABASE_URL=postgresql://${POSTGRES_USER:-crm_user}:${POSTGRES_PASSWORD}@postgres:5432/crm_atacama
      # IA usa user read-only — APENAS SELECT, timeout 10s, max 5 conexões
      - DATABASE_READONLY_URL=postgresql://crm_readonly:${CRM_READONLY_PASSWORD}@postgres:5432/crm_atacama
      - SECRET_KEY=${SECRET_KEY:?Defina SECRET_KEY no .env}
      # AUDIT-2026-08-W1E (F5): o par de seed estava incoerente — a senha era
      # OBRIGATORIA mas SEED_INITIAL_ADMIN nunca chegava ao container, entao
      # app/config.py caia no default `false` em producao e a conta que a senha
      # protegia nunca era criada. Agora o flag e explicito (opt-in, default
      # seguro) e a senha e opcional; config.py ja recusa subir com seed ligado
      # e senha vazia.
      - SEED_INITIAL_ADMIN=${SEED_INITIAL_ADMIN:-false}
      - ADMIN_INITIAL_EMAIL=${ADMIN_INITIAL_EMAIL:-admin@brasileirosnoatacama.com}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - INTERNAL_AI_AUTH_SECRET=${INTERNAL_AI_AUTH_SECRET:-}
      - CONVERSAS_BASE_URL=http://conversas:8001
      - CONVERSAS_API_KEY=${CONVERSAS_API_KEY:?Defina CONVERSAS_API_KEY no .env}
      # AUDIT-2026-08-W1E (F5): sem estas linhas o container ignorava o .env e
      # rodava com os defaults de app/config.py — APP_DOMAIN=127.0.0.1 (links de
      # reset de senha quebrados) e MAIL_PASSWORD com o placeholder do exemplo.
      # Passadas UMA A UMA de proposito (em vez de env_file:) para o contrato do
      # container continuar visivel aqui.
      - APP_DOMAIN=${APP_DOMAIN:-https://crm.crmbrasileirosnoatacama.cloud}
      - INTERNAL_AI_AUTH_MAX_SKEW_SECONDS=${INTERNAL_AI_AUTH_MAX_SKEW_SECONDS:-300}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      - MAX_UPLOAD_SIZE_BYTES=${MAX_UPLOAD_SIZE_BYTES:-10485760}
      - API_KEY_EXPIRY_DAYS=${API_KEY_EXPIRY_DAYS:-0}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_SERVER=${MAIL_SERVER:-smtp.hostinger.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Brasileiros no Atacama}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crm.rule=Host(`crm.crmbrasileirosnoatacama.cloud`)"
      - "traefik.http.routers.crm.entrypoints=websecure"
      - "traefik.http.routers.crm.tls.certresolver=letsencrypt"
      - "traefik.http.services.crm.loadbalancer.server.port=8000"

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n_server
    restart: always
    expose:
      - "5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - NODE_ENV=production
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_SECURE_COOKIE=true
      - N8N_RESTRICT_ENVIRONMENT_VARIABLES_ACCESS=false
      # Meta Cloud API — usado pelos workflows de WhatsApp
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - META_PHONE_NUMBER_ID=${META_PHONE_NUMBER_ID:-}
      - ADMIN_WHATSAPP=${ADMIN_WHATSAPP:-5551990119605}
    volumes:
      - n8n_data:/home/node/.n8n
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.crmbrasileirosnoatacama.cloud`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  conversas:
    build: ./conversas
    container_name: conversas_app
    restart: always
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/api/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      # AUDIT-2026-08-W1E (F2): sem o `:?` o compose interpolava vazio e o
      # Conversas caia no SECRET_KEY constante publicado no repo — os dois
      # servicos validam o MESMO JWT, entao um segredo previsivel aqui aceita
      # token forjado no CRM inteiro. Falha agora no `docker compose up`.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-crm_user}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}@postgres:5432/crm_atacama
      - SECRET_KEY=${SECRET_KEY:?Defina SECRET_KEY no .env}
      - CRM_BASE_URL=http://crm:8000
      - N8N_BASE_URL=http://n8n:5678
      # AUDIT-2026-08-W1E (F4): agente de auto-resposta e OPT-IN. O default era
      # `true` aqui e `false` no codigo/.env.example — esquecer a variavel LIGAVA
      # o bot sozinho na conta de WhatsApp do cliente.
      - N8N_AGENT_ENABLED=${N8N_AGENT_ENABLED:-false}
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN:-}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - META_PHONE_NUMBER_ID=${META_PHONE_NUMBER_ID:-}
      - META_WABA_ID=${META_WABA_ID:-}
      # AUDIT-2026-08-W1E (F6): a Meta aposenta versao da Graph API em ciclo
      # rolante; sem esta linha a unica saida era editar codigo + rebuild.
      - META_API_VERSION=${META_API_VERSION:-v21.0}
      # OPS-CONV-MEDIA-01 (C2): webhook em producao EXIGE HMAC — sem esta
      # variavel o Conversas responde 500 a todo POST da Meta.
      # AUDIT-2026-08-W1E (F3): o `:-` transformava isso numa entrada de
      # WhatsApp morta e INDISTINGUIVEL de crash. Com `:?` a falha aparece no
      # `docker compose up`, com mensagem legivel, e nao no request time.
      - META_APP_SECRET=${META_APP_SECRET:?Defina META_APP_SECRET no .env (HMAC do webhook Meta)}
      # OPS-CONV-MEDIA-01 (C1): espelho local de midia em volume PERSISTENTE
      # (sem isso os arquivos morrem no rebuild do container).
      - CONVERSAS_MEDIA_DIR=/app/data/media
    volumes:
      - conversas_media:/app/data/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.conversas.rule=Host(`conversas.crmbrasileirosnoatacama.cloud`)"
      - "traefik.http.routers.conversas.entrypoints=websecure"
      - "traefik.http.routers.conversas.tls.certresolver=letsencrypt"
      - "traefik.http.services.conversas.loadbalancer.server.port=8001"

volumes:
  pgdata:
  n8n_data:
  conversas_media:
